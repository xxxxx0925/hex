<style>
/* Layout: one dark stage. Lines type in slowly, a choice appears, every choice leads to the same dread, then the sign-up screen. */
:root {
  --ink: #070506;
  --bone: #e9e0cf;
  --ash: #8d8277;
  --blood: #b3261a;
  --glow: #ff5a3c;
  --f-brush: "Zhi Mang Xing", "STKaiti", "KaiTi", serif;

  --f-en: "Cormorant Garamond", Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--ink); color: var(--bone);
  font-family: var(--f-body); overflow: hidden;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
body::before { /* vignette */
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 20;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.85) 100%);
}
body::after { /* grain */
  content: ""; position: fixed; inset: -10%; pointer-events: none; z-index: 21; opacity: .5;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
  animation: grain .9s steps(4) infinite;
}
@keyframes grain { 0% { transform: translate(0,0) } 25% { transform: translate(-3%,2%) } 50% { transform: translate(2%,-3%) } 75% { transform: translate(-2%,-1%) } 100% { transform: translate(0,0) } }
@keyframes appear { from { opacity: 0 } to { opacity: 1 } }
:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }

.stage {
  position: relative; height: 100%; max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column; justify-content: center;
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
  box-sizing: border-box; transform-origin: 50% 50%;
}
#log { display: flex; flex-direction: column; gap: 14px; }
.line { font-size: clamp(18px, 5vw, 22px); line-height: 1.9; min-height: 1.9em; }
body.lang-en .line { font-family: var(--f-en); font-size: 25px; line-height: 1.45; }
.line.big { font-family: var(--f-brush); font-size: clamp(80px, 26vw, 150px); line-height: 1; color: var(--bone); text-shadow: 0 0 26px rgba(179,38,26,.7); }
body.lang-en .line.big { font-family: var(--f-en); font-size: clamp(56px, 18vw, 96px); }
.line.quote { color: var(--bone); font-style: italic; }
.line.whisper { color: var(--ash); font-size: .9em; }
.line.dim { opacity: .45; }

.choices { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 30px; }
.choices:not(:empty) { animation: appear 1.4s both; }
.choice {
  flex: 1 1 40%; min-height: 62px; cursor: pointer;
  font-family: var(--f-brush); font-size: 30px; letter-spacing: .12em; color: var(--bone);
  background: transparent; border: 1px solid rgba(233,224,207,.4); padding: 12px 16px;
  animation: tremor 3.2s infinite;
}
body.lang-en .choice { font-family: var(--f-en); font-size: 26px; letter-spacing: .04em; }
.choice:hover, .choice:active { border-color: var(--glow); color: var(--glow); }
@keyframes tremor { 0%,90%,100% { transform: translate(0,0) } 92% { transform: translate(2px,-1px) } 94% { transform: translate(-2px,1px) } 96% { transform: translate(1px,2px) } }

/* four words that cannot be undone */
.hzwrap { display: flex; flex-wrap: wrap; justify-content: center; gap: .15em .3em; }
.hz {
  font-family: var(--f-brush); font-size: clamp(88px, 30vw, 160px); line-height: 1.05; color: var(--blood);
  text-shadow: 3px 0 rgba(255,90,60,.8), -3px 0 rgba(233,224,207,.45), 0 0 34px rgba(179,38,26,.9);
  animation: jit .14s steps(2) infinite;
}
body.lang-en .hz { font-family: var(--f-en); font-size: clamp(54px, 17vw, 100px); }
@keyframes jit { 0% { transform: translate(0,0) } 50% { transform: translate(2px,-2px) } 100% { transform: translate(-2px,1px) } }

.shake { animation: shake .55s; }
@keyframes shake { 0%,100% { transform: translate(0,0) } 10% { transform: translate(-16px,8px) } 25% { transform: translate(14px,-10px) } 40% { transform: translate(-12px,-6px) } 60% { transform: translate(10px,9px) } 80% { transform: translate(-6px,4px) } }
.corrupt { animation: corrupt 1s steps(10); }
@keyframes corrupt { 0% { filter: none } 20% { transform: skewX(14deg) translateX(10px); filter: contrast(2) hue-rotate(-30deg) } 40% { transform: skewX(-18deg); filter: invert(1) } 60% { transform: scaleY(.2); filter: contrast(3) } 80% { transform: skewX(8deg) translateX(-14px); filter: grayscale(1) } 100% { transform: none; filter: none } }
.spin { animation: spin 2.4s cubic-bezier(.65,0,.25,1) forwards; }
@keyframes spin { 0% { transform: rotate(0) scale(1); filter: blur(0) } 55% { transform: rotate(420deg) scale(.55); filter: blur(2px) } 100% { transform: rotate(900deg) scale(.08); filter: blur(5px); opacity: 0 } }

#flash { position: fixed; inset: 0; opacity: 0; pointer-events: none; z-index: 50; background: var(--blood); }
#flash.white { background: var(--bone); }
#flash.on { animation: fl .45s ease-out; }
@keyframes fl { 0% { opacity: .9 } 100% { opacity: 0 } }

#scare { position: fixed; inset: 0; z-index: 60; background: #000; display: grid; place-items: center; }
#scare svg { width: 100%; height: 100%; animation: zoom .6s ease-in forwards; }
@keyframes zoom { from { transform: scale(1) } to { transform: scale(1.35) } }

/* gate and end screens */
#gate, #end {
  position: fixed; inset: 0; z-index: 40; background: var(--ink); overflow-y: auto;
  padding-block: calc(28px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.panel { max-width: 560px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
#end { animation: appear 3s both; }
.kicker { font-family: var(--f-en); font-style: italic; letter-spacing: .16em; color: var(--ash); font-size: 14px; text-transform: uppercase; }
.warn { color: var(--glow); letter-spacing: .06em; }
.gbtn {
  font: inherit; cursor: pointer; color: var(--bone); background: transparent;
  border: 1px solid var(--blood); padding: 16px 20px; font-size: 20px; letter-spacing: .2em; min-height: 56px;
}
.gbtn:hover { background: var(--blood); }
.btnrow { display: grid; gap: 12px; }
.mutechk { display: flex; align-items: center; gap: 10px; color: var(--ash); font-size: 14px; }
.mutechk input { width: 18px; height: 18px; accent-color: var(--blood); }

#mute {
  position: fixed; z-index: 70; font: inherit; font-size: 13px; letter-spacing: .1em; cursor: pointer;
  top: calc(env(safe-area-inset-top, 0px) + 10px); right: max(14px, env(safe-area-inset-right, 0px));
  color: var(--ash); background: transparent; border: 1px solid rgba(141,130,119,.5); padding: 4px 10px;
}

#end h1 { font-family: var(--f-brush); font-weight: 400; font-size: clamp(120px, 40vw, 210px); line-height: 1; margin: 0; text-shadow: 0 0 34px rgba(179,38,26,.7); animation: flick 6s infinite; }
body.lang-en #end h1 { font-family: var(--f-en); font-size: clamp(54px, 17vw, 96px); font-weight: 500; }
@keyframes flick { 0%,91%,100% { opacity: 1 } 92% { opacity: .2 } 93% { opacity: 1 } 95% { opacity: .5 } 96% { opacity: 1 } }
.eye { width: min(280px, 66vw); height: auto; overflow: visible; }
.eye .lid { fill: #0d0807; stroke: var(--blood); stroke-width: 2; }
.eye .iris { fill: var(--blood); }
.eye .pupil { fill: #030202; }
.eye .shine { fill: var(--bone); opacity: .85; }
.eye .blink { animation: blink 5s infinite; transform-origin: 150px 60px; }
@keyframes blink { 0%,94%,100% { transform: scaleY(1) } 96% { transform: scaleY(.05) } }
.cta {
  display: inline-block; text-decoration: none; text-align: center; cursor: pointer;
  font: inherit; font-size: 20px; letter-spacing: .25em; padding: 15px 28px;
  background: var(--blood); border: 1px solid var(--blood); color: #fff3e8; box-shadow: 0 0 28px rgba(179,38,26,.6);
}
.cta:hover { background: var(--glow); border-color: var(--glow); color: #1a0a06; }
.cta[aria-disabled="true"] { background: transparent; color: var(--ash); border-color: var(--ash); box-shadow: none; pointer-events: none; letter-spacing: .1em; font-size: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.small { font: inherit; font-size: 13px; letter-spacing: .1em; cursor: pointer; color: var(--bone); background: transparent; border: 1px solid rgba(233,224,207,.35); padding: 8px 14px; }
.small:hover { border-color: var(--glow); color: var(--glow); }
.dimtxt { color: var(--ash); }
.foot { color: var(--ash); font-size: 13px; letter-spacing: .08em; }

@media (prefers-reduced-motion: reduce) {
  body::after, .choice, .hz, #end h1, .eye .blink { animation: none; }
}
</style>

<script>
(function () {
  // Put the sign-up form link here. While empty, the button shows as "coming soon".
  var REG_URL = "";

  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), log = $("log"), choices = $("choices"), flashEl = $("flash");
  var scare = $("scare"), fA = $("fA"), fB = $("fB"), gate = $("gate"), end = $("end"), muteBtn = $("mute");
  var lang = "zh", skip = false, running = false;
  var reduced = false;
  try { reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
  function t(zh, en) { return lang === "en" ? en : zh; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  /* ---------- sound (all synthesized, nothing to download) ---------- */
  var AC = null, master = null, droneGain = null, muted = false, hbTimer = null, hbBpm = 0;
  function initAudio() {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(AC.destination);
      var lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 200;
      droneGain = AC.createGain(); droneGain.gain.value = 0;
      var o1 = AC.createOscillator(), o2 = AC.createOscillator(), lfo = AC.createOscillator(), lg = AC.createGain();
      o1.type = "sawtooth"; o2.type = "sawtooth"; o1.frequency.value = 55; o2.frequency.value = 58.3;
      lfo.frequency.value = 0.12; lg.gain.value = 90; lfo.connect(lg); lg.connect(lp.frequency);
      o1.connect(lp); o2.connect(lp); lp.connect(droneGain); droneGain.connect(master);
      o1.start(); o2.start(); lfo.start();
    } catch (e) { AC = null; }
  }
  function droneTo(v, secs) { if (AC) droneGain.gain.setTargetAtTime(v, AC.currentTime, (secs || 1) / 3); }
  function noiseBuf(sec) {
    var n = Math.floor(AC.sampleRate * sec), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function noiseBurst(dur, freq, vol, type) {
    if (!AC) return;
    var s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), now = AC.currentTime;
    s.buffer = noiseBuf(dur); f.type = type || "bandpass"; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(now);
  }
  function thump(when, vol) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(95, when); o.frequency.exponentialRampToValueAtTime(38, when + 0.14);
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(vol, when + 0.012); g.gain.exponentialRampToValueAtTime(0.001, when + 0.22);
    o.connect(g); g.connect(master); o.start(when); o.stop(when + 0.25);
  }
  function heartLoop() {
    if (!AC || !hbBpm) { hbTimer = null; return; }
    var now = AC.currentTime + 0.02; thump(now, 0.9); thump(now + 0.2, 0.55);
    hbTimer = setTimeout(heartLoop, 60000 / hbBpm);
  }
  function heart(bpm) { hbBpm = bpm; if (bpm && !hbTimer && AC) heartLoop(); }
  function hit() {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain(), now = AC.currentTime;
    o.type = "sine"; o.frequency.setValueAtTime(140, now); o.frequency.exponentialRampToValueAtTime(28, now + 0.7);
    g.gain.setValueAtTime(1, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
    o.connect(g); g.connect(master); o.start(now); o.stop(now + 1);
    noiseBurst(0.5, 1200, 0.7, "lowpass");
  }
  function screech() {
    if (!AC) return;
    var now = AC.currentTime;
    [[880, 1760], [932, 1480], [1244, 2093]].forEach(function (p) {
      var o = AC.createOscillator(), g = AC.createGain(), hp = AC.createBiquadFilter();
      o.type = "sawtooth"; hp.type = "highpass"; hp.frequency.value = 600;
      o.frequency.setValueAtTime(p[0], now); o.frequency.exponentialRampToValueAtTime(p[1], now + 0.5);
      g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.22, now + 0.03); g.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
      o.connect(hp); hp.connect(g); g.connect(master); o.start(now); o.stop(now + 0.8);
    });
    noiseBurst(0.6, 3000, 0.45, "highpass");
  }
  function knock(n) {
    if (!AC) return;
    for (var i = 0; i < n; i++) {
      var at = AC.currentTime + i * 0.4, o = AC.createOscillator(), g = AC.createGain();
      o.type = "triangle"; o.frequency.setValueAtTime(190, at); o.frequency.exponentialRampToValueAtTime(60, at + 0.09);
      g.gain.setValueAtTime(0.9, at); g.gain.exponentialRampToValueAtTime(0.001, at + 0.16);
      o.connect(g); g.connect(master); o.start(at); o.stop(at + 0.2);
    }
  }
  muteBtn.addEventListener("click", function () {
    muted = !muted;
    if (master) master.gain.value = muted ? 0 : 0.9;
    muteBtn.textContent = muted ? "♪ OFF" : "♪ ON";
  });

  /* ---------- screen effects ---------- */
  function flash(kind) {
    if (reduced) return;
    flashEl.className = ""; void flashEl.offsetWidth; flashEl.className = "on " + (kind || "");
  }
  function addClass(el, cls, ms) {
    el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
    setTimeout(function () { el.classList.remove(cls); }, ms);
  }
  function shake() { if (!reduced) addClass(stage, "shake", 600); vib([80, 40, 120]); }
  function clear() { log.innerHTML = ""; choices.innerHTML = ""; }

  /* ---------- storytelling helpers ---------- */
  stage.addEventListener("pointerdown", function () { skip = true; });
  async function say(text, opt) {
    opt = opt || {};
    var d = document.createElement("div"); d.className = "line " + (opt.cls || ""); log.appendChild(d);
    var per = opt.speed || (lang === "en" ? 42 : 95);
    skip = false;
    for (var i = 0; i < text.length; i++) {
      d.textContent = text.slice(0, i + 1);
      if (skip) { d.textContent = text; break; }
      await sleep(per * (0.6 + Math.random() * 0.8));
    }
    await sleep(opt.after == null ? 700 : opt.after);
    return d;
  }
  function choose(opts) {
    return new Promise(function (resolve) {
      choices.innerHTML = "";
      opts.forEach(function (o, i) {
        var b = document.createElement("button");
        b.className = "choice"; b.type = "button"; b.textContent = t(o.zh, o.en);
        if (o.alt) b.addEventListener("pointerdown", function () { b.textContent = t(o.alt[0], o.alt[1]); });
        b.addEventListener("click", function () { choices.innerHTML = ""; resolve(i); });
        choices.appendChild(b);
      });
    });
  }

  /* ---------- the story ---------- */
  async function scene1() {
    clear(); droneTo(0.07, 4); await sleep(1400);
    await say(t("今晚，有人把一张请帖塞进了你的口袋。", "Tonight, someone slipped an invitation into your pocket."));
    await say(t("你没有看见是谁。", "You did not see who."));
    await say(t("上面没有署名，只有一个字：", "There is no name. Only one word:"));
    await say(t("来。", "Come."), { cls: "big", speed: 300, after: 1000 });
    var c = await choose([
      { zh: "去", en: "Go" },
      { zh: "不去", en: "Don't go", alt: ["去", "Go"] }
    ]);
    clear(); await sleep(700);
    if (c === 1) {
      await say(t("你说不去。", "You said no."));
      await say(t("可你的脚没有停。", "Your feet did not stop."), { after: 900 });
      clear(); await sleep(400);
    }
    heart(54); droneTo(0.1, 3);
    await say(t("你已经在路上了。", "You are already on your way."), { after: 1200 });
  }

  async function scene2() {
    clear(); heart(64); await sleep(500);
    await say(t("路灯一盏一盏地灭了。", "The streetlights go out, one by one."));
    await say(t("前面是岔路口。路边站着一个人，背对着你。", "A fork in the road. Someone stands beside it, back turned to you."));
    await say(t("你问：“请问，路怎么走？”", "You ask: \"Excuse me, which way?\""), { cls: "quote" });
    await say(t("他没有回头，慢慢抬起手，指向——", "He does not turn. Slowly, he raises a hand and points toward—"), { after: 1400 });
    await choose([
      { zh: "左", en: "Left" },
      { zh: "右", en: "Right" },
      { zh: "来时的路", en: "The way back" }
    ]);
    clear(); heart(96); droneTo(0.18, 1);
    await say(t("你刚迈出一步，", "You take one step,"), { after: 500 });
    await say(t("世界歪了。", "and the world tilts."), { after: 300 });
    noiseBurst(1.2, 800, 0.5, "bandpass");
    if (!reduced) {
      addClass(stage, "corrupt", 1000); flash("white"); await sleep(1000);
      stage.classList.add("spin"); vib([60, 60, 60, 60, 200]);
      setTimeout(clear, 1900); await sleep(2400); stage.classList.remove("spin");
    } else {
      stage.style.opacity = 0; await sleep(1200); clear(); stage.style.opacity = 1;
    }
    clear(); await sleep(900);
    var wrap = document.createElement("div"); wrap.className = "hzwrap"; log.appendChild(wrap);
    var chars = lang === "en" ? ["No", "way", "back."] : ["回", "不", "去", "了"];
    for (var i = 0; i < chars.length; i++) {
      var s = document.createElement("span"); s.className = "hz"; s.textContent = chars[i]; wrap.appendChild(s);
      if (AC) { thump(AC.currentTime + 0.01, 1); }
      vib(40);
      await sleep(850);
    }
    hit(); shake(); flash(); heart(120);
    await sleep(2400);
    clear(); await sleep(600);
    await say(t("你来的那条路，从来就不存在。", "The road you came by never existed."), { cls: "whisper", after: 1800 });
  }

  async function scene3() {
    clear(); heart(70); droneTo(0.1, 2); await sleep(800);
    await say(t("黑暗里，有一扇门。", "In the dark, there is a door."));
    knock(3);
    await say(t("门里有人在敲。", "Someone is knocking."), { after: 1500 });
    await say(t("不是从外面敲的。", "Not from outside."), { after: 1200 });
    var c = await choose([
      { zh: "开门", en: "Open it" },
      { zh: "不开", en: "Leave it", alt: ["开门", "Open it"] }
    ]);
    clear(); await sleep(700);
    await say(c === 0 ? t("门开了。", "The door opens.") : t("门自己开了。", "The door opens by itself."), { after: 600 });
    clear();
    heart(0); droneTo(0, 0.05);
    await sleep(1500);
    scare.hidden = false; fA.hidden = false; fB.hidden = true;
    hit(); shake(); vib([200, 60, 300]);
    await sleep(170);
    fA.hidden = true; fB.hidden = false; screech();
    await sleep(520);
    scare.hidden = true;
    await sleep(1800);
    await say(t("别回头。", "Do not turn around."), { cls: "whisper", speed: 220, after: 2400 });
  }

  function showEnd() {
    clear(); heart(46); droneTo(0.05, 4);
    $("endKicker").textContent = t("亚大华文学会 · 密室逃脱 2026 · HEX", "APU CLCS · Escape Room 2026 · HEX");
    $("endTitle").textContent = t("灵契", "The Spirit Contract");
    $("endLine").innerHTML = t("有人在里面等你。<br>三扇门，你只能进一扇。", "Someone is waiting for you inside.<br>Three doors. You may enter only one.");
    $("reg").textContent = t("报名入局", "Register now");
    $("copy").textContent = t("复制链接", "Copy link");
    $("again").textContent = t("再走一次", "Walk it again");
    setNote("");
    end.hidden = false;
  }
  function setNote(msg) {
    $("note").textContent = msg || (REG_URL ? "" : t("报名通道即将开启。", "Sign-up opens soon."));
  }

  async function play() {
    if (running) return; running = true;
    end.hidden = true;
    await scene1(); await scene2(); await scene3();
    showEnd(); running = false;
  }

  /* ---------- gate, sign-up, replay ---------- */
  function enter(l) {
    lang = l; document.body.classList.toggle("lang-en", l === "en");
    document.documentElement.lang = l === "en" ? "en" : "zh-Hans";
    muted = $("mutedChk").checked;
    initAudio();
    if (AC && AC.state === "suspended") { try { AC.resume(); } catch (e) {} }
    muteBtn.textContent = muted ? "♪ OFF" : "♪ ON"; muteBtn.hidden = false;
    gate.hidden = true; scare.hidden = true;
    play();
  }
  $("goZh").addEventListener("click", function () { enter("zh"); });
  $("goEn").addEventListener("click", function () { enter("en"); });
  $("again").addEventListener("click", function () { play(); });

  var reg = $("reg"), copyBtn = $("copy");
  if (REG_URL) {
    reg.href = REG_URL; reg.removeAttribute("aria-disabled"); copyBtn.hidden = false;
    copyBtn.addEventListener("click", function () {
      function done() { setNote(t("链接已复制。", "Link copied.")); }
      function fallback() { setNote(REG_URL); }
      try { navigator.clipboard.writeText(REG_URL).then(done, fallback); } catch (e) { fallback(); }
    });
  }

  /* the eye on the last screen follows your finger */
  var iris = $("iris"), pupil = $("pupil"), shine = $("shine"), eye = $("eye");
  function look(x, y) {
    var r = eye.getBoundingClientRect();
    var dx = Math.max(-1, Math.min(1, (x - (r.left + r.width / 2)) / (window.innerWidth / 2)));
    var dy = Math.max(-1, Math.min(1, (y - (r.top + r.height / 2)) / (window.innerHeight / 2)));
    var ox = dx * 44, oy = dy * 16;
    iris.setAttribute("cx", 150 + ox); iris.setAttribute("cy", 60 + oy);
    pupil.setAttribute("cx", 150 + ox * 1.1); pupil.setAttribute("cy", 60 + oy * 1.1);
    shine.setAttribute("cx", 140 + ox); shine.setAttribute("cy", 50 + oy);
  }
  window.addEventListener("pointermove", function (e) { look(e.clientX, e.clientY); });
  window.addEventListener("pointerdown", function (e) { look(e.clientX, e.clientY); });
})();
</script>
